name: secret-scan
# 公开分发仓的密钥自检 —— 谁往这个仓加带 key 的内容, CI 自动拦。
# 机制: 靠纪律的闸会漏 = 闸要长在流水线上 = 不依赖任何人记得扫。
on: [push, pull_request]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secrets
        run: |
          PATTERNS='gh[pousr]_[A-Za-z0-9]{20,}|tvly-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{24,}|sk-ant-[A-Za-z0-9_-]{20,}|ark-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}-[0-9a-f]{8,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|xox[baprs]-[A-Za-z0-9-]{10,}|Bearer[[:space:]]+[A-Za-z0-9._-]{24,}|password_hash:[[:space:]]*scrypt\$'
          if grep -rEn "$PATTERNS" --exclude-dir=.git . ; then
            echo "::error::发现疑似密钥 = 请脱敏后重推"
            exit 1
          fi
          echo "OK 未发现密钥"

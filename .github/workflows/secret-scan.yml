name: secret-scan
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secrets
        run: |
          PATTERNS='gh[pousr]_[A-Za-z0-9]{30,}|tvly-[A-Za-z0-9_-]{30,}|sk-[A-Za-z0-9]{30,}|ark-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}-[0-9a-f]{8,}'
          if grep -rEn "$PATTERNS" --exclude-dir=.git . ; then
            echo "::error::发现疑似密钥"; exit 1
          fi
          echo "OK 未发现密钥"
